# サイト全体の設定です。フォークしたら、まずここを自分のブログ用に書き換えてください。
# 書式は `キー: 値`。`#` で始まる行はコメントです。
# テンプレートからは {{site_title}} のように `site_` を付けた名前で参照できます。

# ヘッダー・<title>・フッターに表示されるサイト名
title: techlog

# ヘッダーのキャッチコピーと <meta name="description">
description: @Nagataniの技術ブログ

# <meta name="author">
author: Nagatani

# <html lang="..."> の値
lang: ja

# 公開 URL（例: https://<ユーザー名>.github.io/bare/）。フィード・サイトマップ・OGP の絶対 URL に使います。
# GitHub Actions でのビルドでは Pages の URL（独自ドメインを含む）が自動で使われるため、空のままで構いません。
# GitHub Pages 以外で公開する場合や、手元でフィードを確認したい場合に書いてください。
base_url: https://nagatani.github.io/techlog/

# SNS で共有したときのプレビュー画像（記事の frontmatter の image が優先）。
# content/static/ に置いた画像を /images/ogp.png のように指定します。
image:

# 記事一覧の 1 ページあたりの件数。超えた分は page/2.html, page/3.html ... に分かれます。
# 空にすると、すべての記事を 1 ページに並べます。
per_page: 10

# 使うテーマ（content/themes/ の下のディレクトリ名）。空なら default。
# テーマには変えたいファイルだけを置けばよく、残りは default のものが使われます。
theme:
